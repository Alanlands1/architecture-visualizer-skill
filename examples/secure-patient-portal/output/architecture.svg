<text x="28" y="347" font-size="10.5" fill="#526579">Border: blue = stated, amber = inferred, red = unknown   |   Solid arrow = direct request or data access   |   Dashed arrow = message, event, file or scheduled job   |   Teal arrow = encrypted   |   Red arrow = blocked   |   Dashed frame = zone</text>
